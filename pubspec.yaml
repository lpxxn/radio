name: shiguang_radio
description: 时光收音机 — 用 Flutter 与 Riverpod 学习跨平台直播音频。
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  just_audio: ^0.10.5
  media_kit: ^1.2.0
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stations.json
    - assets/fonts/OFL.txt
  fonts:
    - family: RadioSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
